<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Argos</title>
  <defs>
    <!-- recorta A e R na altura das maiúsculas: topo e pés planos, como na fonte -->
    <clipPath id="caps"><rect x="-10" y="16" width="90" height="32"/></clipPath>
  </defs>
  <g stroke="#E6DAC6" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- A (extra negrito) -->
    <path d="M6 52 L16 12 L26 52" stroke-width="6.8" clip-path="url(#caps)"/>
    <!-- travessa do A, que se estende até o R e liga as duas letras -->
    <path d="M9.5 42 H31.9" stroke-width="5"/>
    <!-- R: haste, barriga e perna -->
    <path d="M31.9 16 V48" stroke-width="6.8"/>
    <path d="M31.9 19.4 H41 A7.6 7.6 0 0 1 41 34.6 H31.9" stroke-width="6.8"/>
    <path d="M38.2 34 L48.5 52.8" stroke-width="6.8" clip-path="url(#caps)"/>
  </g>
  <!-- ponto verde do logotipo -->
  <circle cx="57" cy="44.7" r="3.3" fill="#7DBE8C"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
